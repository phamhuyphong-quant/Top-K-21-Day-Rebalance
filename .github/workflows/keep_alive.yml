name: Keep Streamlit App Alive

on:
  schedule:
    # Runs every 6 hours — well within the 12-hour sleep threshold
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # Allow manual trigger anytime

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 🏓 Ping Streamlit App
        run: |
          echo "Pinging app at $(date)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://crosssectionalrankvn100-analyzing.streamlit.app/)
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ App is awake and responding!"
          else
            echo "⚠️ App returned status $STATUS — it may be waking up."
          fi
