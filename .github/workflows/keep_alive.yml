name: Keep Streamlit App Alive

on:
  schedule:
    # Runs every 6 hours — well within the 12-hour sleep threshold
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # Allow manual trigger anytime

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: pip install playwright && playwright install --with-deps chromium

      - name: Ping with real browser session
        run: |
          python3 - <<'EOF'
          from playwright.sync_api import sync_playwright
          import time
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto("https://cross-sectional-ranking-vn.streamlit.app/", timeout=60000)
              time.sleep(15)  # Hold session open
              browser.close()
          EOF