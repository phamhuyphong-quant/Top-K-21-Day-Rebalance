  name: Precompute Model Artifacts

  on:
    workflow_run:
      workflows: ["Daily VN100 Data Update"]
      types:
        - completed
    workflow_dispatch:

  jobs:
    precompute:
      runs-on: ubuntu-latest
      permissions:
        contents: write
      if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

      steps:
        - name: Checkout main branch
          uses: actions/checkout@v4
          with:
            ref: main

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        - name: Install Kaggle CLI and configure credentials
          env:
            KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
            KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          run: |
            pip install kaggle
            mkdir -p ~/.kaggle
            echo "{\"username\":\"${KAGGLE_USERNAME}\",\"key\":\"${KAGGLE_KEY}\"}" > ~/.kaggle/kaggle.json
            chmod 600 ~/.kaggle/kaggle.json

        - name: Inject GH_PAT and push kernel to Kaggle
          env:
            KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
            KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
            GH_PAT: ${{ secrets.GH_PAT }}
          run: |
            sed -i "s|GH_PAT = os.environ\['GH_PAT'\]|GH_PAT = '${GH_PAT}'|" kaggle_kernel/kernel.py
            kaggle kernels push -p kaggle_kernel/

        - name: Wait for Kaggle kernel to complete
          env:
            KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
            KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          run: |
            KERNEL="phmhuyphongp/precompute-vn100"
            echo "Waiting for kernel: $KERNEL"
            sleep 30
            for i in $(seq 1 60); do
              RAW=$(kaggle kernels status $KERNEL 2>&1)
              echo "[$i/60] Raw output: $RAW"
              if echo "$RAW" | grep -q "COMPLETE"; then
                echo "Kernel completed successfully!"
                exit 0
              fi
              if echo "$RAW" | grep -q "ERROR\|CANCEL"; then
                echo "Kernel failed!"
                exit 1
              fi
              sleep 60
            done
            echo "Timed out after 60 minutes"; exit 1

        - name: Download kernel outputs
          env:
            KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
            KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          run: |
            mkdir -p /tmp/pretrained_artifacts
            kaggle kernels output ${{ secrets.KAGGLE_USERNAME }}/precompute-vn100 -p /tmp/pretrained_artifacts/

        - name: Checkout data-storage branch
          uses: actions/checkout@v4
          with:
            ref: data-storage
            clean: true

        - name: Commit and push artifacts to data-storage
          run: |
            cp /tmp/pretrained_artifacts/pretrained_predictions.parquet .
            cp /tmp/pretrained_artifacts/pretrained_equity_curve.parquet .

            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add pretrained_predictions.parquet pretrained_equity_curve.parquet
            git commit -m "data: automated precompute update $(date)" || echo "No changes to commit"
            git push origin data-storage