name: Daily VN100 Data Update

on:
  schedule:
    # Runs at 10:00 AM UTC (5:00 PM Vietnam Time) Mon-Fri
    - cron: '17 10 * * 1-5'
  workflow_dispatch: # Manual trigger button

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Code (Main Branch)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U vnstock pandas pyarrow

      - name: ⚙️ Run Data Collection
        run: |
          python src/data_collect.py

      - name: 🚀 Push Data to Storage Branch
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 1. Move the fresh data to a safe spot OUTSIDE the repo folder
          mv data/market_data.parquet ../market_data_temp.parquet
          
          # 2. Fetch and switch to the storage branch
          git fetch origin data-storage
          git checkout data-storage
          
          # 3. Move the fresh data back into the root of this branch
          mv ../market_data_temp.parquet market_data.parquet
          
          # 4. Commit and push
          git add market_data.parquet
          git diff --cached --quiet && echo "No changes" || git commit -m "data: automated market update $(date +'%Y-%m-%d')"
          git push origin data-storage