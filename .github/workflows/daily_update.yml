name: Daily VN Data Update

on:
  workflow_dispatch:

# Prevent two updates from running at the same time (e.g. accidental double trigger)
concurrency:
  group: daily-vn-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write   # needed to dispatch precompute_model.yml

    steps:
      - name: 📥 Checkout source code from main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install vnstock pandas pyarrow huggingface_hub --extra-index-url https://vnstocks.com/api/simple

      # Pulls existing parquet from the HF dataset, fetches new days, uploads back
      # to HF if anything changed, and sets outputs.changed for the next step.
      - name: 🚀 Run data collection
        id: collect
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python src/data_collect.py

      - name: 🧠 Trigger precompute model (only if data changed)
        if: steps.collect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run precompute_model.yml --repo "${{ github.repository }}" --ref main