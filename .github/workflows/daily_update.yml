name: Daily VN100 Data Update

on:
  schedule:
    - cron: '17 10 * * 1-5'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout data-storage branch
        uses: actions/checkout@v4
        with:
          ref: data-storage

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install vnstock pandas pyarrow
        
      - name: 📥 Checkout source code from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main_src

      - name: 🚀 Run data collection
        run: python main_src/src/data_collect.py

      - name: 💾 Commit and push if data changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add market_data.parquet
          git diff --cached --quiet && echo "No changes" || git commit -m "data: automated market update $(date +'%Y-%m-%d')"
          git push origin data-storage

  trigger-precompute:
    needs: update-data
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: 🔁 Trigger precompute workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'precompute_model.yml',
              ref: 'main'
            });
            console.log('✅ Precompute workflow triggered!');