name: Daily VN Data Update

on:
  workflow_dispatch:

# Prevent two updates from running at the same time (e.g. accidental double trigger)
concurrency:
  group: daily-vn-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write   # needed to dispatch precompute_model.yml

    steps:
      - name: 📥 Checkout data_storage branch
        uses: actions/checkout@v4
        with:
          ref: data-storage

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install vnstock pandas pyarrow

      - name: 📥 Checkout source code from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main_src

      - name: 🚀 Run data collection
        run: python main_src/src/data_collect.py

      - name: 💾 Commit and push if data changed
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add market_data.parquet vnindex_data.parquet
          if git diff --cached --quiet; then
            echo "No changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: automated market update $(date +'%Y-%m-%d')"
            git push origin data-storage
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 🧠 Trigger precompute model (only if data changed)
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run precompute_model.yml --repo "${{ github.repository }}" --ref main